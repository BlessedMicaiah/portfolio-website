
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Faithology</title>
        <meta
            name="description"
            content="Something amazing is coming soon. Stay tuned!"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/main.css" />
    </head>
    <body>
        <div class="container">
            <!-- Typing Animation Text -->
            <div class="typing-animation" id="typingAnimation">
                <div class="typing-text">
                    <span class="typed-text" id="typedPhrases"></span>
                    <span class="cursor"></span>
                </div>
            </div>

            <!-- Countdown -->
            <div class="countdown-container" id="countdownContainer">
                <div class="countdown" id="countdown">
                    <div class="countdown-item">
                        <div class="countdown-number" id="days">00</div>
                        <div class="countdown-label">Days</div>
                    </div>
                    <div class="countdown-item">
                        <div class="countdown-number" id="hours">00</div>
                        <div class="countdown-label">Hours</div>
                    </div>
                    <div class="countdown-item">
                        <div class="countdown-number" id="minutes">00</div>
                        <div class="countdown-label">Minutes</div>
                    </div>
                    <div class="countdown-item">
                        <div class="countdown-number" id="seconds">00</div>
                        <div class="countdown-label">Seconds</div>
                    </div>
                </div>
                <div class="countdown-subtitle" id="countdownSubtitle">
                    Faithology is Under Construction...
                </div>
                <!-- Loading Progress Bar -->
                <div class="loading-bar-container" id="loadingBarContainer">
                    <div class="loading-bar" id="loadingBar">
                        <div class="loading-bar-progress" id="loadingBarProgress"></div>
                    </div>
                    <div class="loading-percentage" id="loadingPercentage">0%</div>
                </div>
            </div>

            <!-- Resume Button -->
            <div class="resume-button" id="resumeButton">
                <a href="minimalistic.html" class="resume-btn">
                    <span>Click to view minimal Resume</span>
                    <span class="arrow">→</span>
                </a>
            </div>
        </div>

        <script src="js/main.js"></script>
    </body>
</html>
